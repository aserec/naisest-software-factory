name: musicapp_webapp
# Tickets are cards on the shared musicapp board, and changes are pull requests: both need FACTORY_GITHUB_TOKEN.
tracker: github-project
codeHost: github
githubRepo: musicapp/musicapp-webapp
githubProject: 2 # https://github.com/orgs/musicapp/projects/2, shared with musicapp-backend: only this repo's issues count
projectPath: musicapp/musicapp-webapp # GitLab adapters only; the github ones use githubRepo
baseBranch: main
defaultApprover: aserec
# The agents write comments, questions, commit messages and pull requests in this language. No key: English.
language: Spanish
# The token is aserec's own until the factory gets its own GitHub account: aserec's Ready counts. Remove it then.
sharedAccount: true
jobImage: gitlab.example.com:5050/ceresa/software-factory/job:main
protectedPaths:
  - ".github/**"
  - "**/.env*"
  - "vendor/**"
  - "scripts/precommit/**"
  - ".factory.yml"
  - CLAUDE.md
  - AGENTS.md
  - ".claude/**"
  - ".agents/**"
  - ".codex/**"
  - ".cursor/**"
  - ".gemini/**"
  - ".mcp.json"
  - "**/.gitattributes"
  - ".factory/**"
dependencyFiles:
  - "**/package.json"
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
