name: musicapp_backend
# Tickets are cards on the shared musicapp board, and changes are pull requests: both need FACTORY_GITHUB_TOKEN.
tracker: github-project
codeHost: github
githubRepo: musicapp/musicapp-backend
githubProject: 2 # https://github.com/orgs/musicapp/projects/2, shared with musicapp-webapp: only this repo's issues count
projectPath: musicapp/musicapp-backend # GitLab adapters only; the github ones use githubRepo
baseBranch: main
defaultApprover: aserec
# The token is aserec's own until the factory gets its own GitHub account: aserec's Ready counts. Remove it then.
sharedAccount: true
# The runner image (runner/Dockerfile) has uv and Python 3.15. A local run needs python3.15 on PATH: uv python install 3.15.
jobImage: gitlab.example.com:5050/ceresa/software-factory/job:main
protectedPaths:
  - ".github/**"
  - "**/.env*"
  - "**/migrations/**"
  - "**/alembic/**"
  - ".factory.yml"
  - CLAUDE.md
  - AGENTS.md
  - ".claude/**"
  - ".agents/**"
  - ".cursor/**"
  - "**/.gitattributes"
  - ".factory/**"
dependencyFiles:
  - "pyproject.toml"
  - "uv.lock"
