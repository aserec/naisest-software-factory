    CI_PIPELINE_URL="$CI_PIPELINE_URL" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_IMAGE="$CI_JOB_IMAGE" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE" CI_JOB_ID="$CI_JOB_ID"
    FACTORY_PIPELINE="$FACTORY_PIPELINE" FACTORY_TARGET="$FACTORY_TARGET" FACTORY_WORK_ITEM_IID="$FACTORY_WORK_ITEM_IID"
    FACTORY_MR_IID="$FACTORY_MR_IID" FACTORY_BUILD_PIPELINE_ID="$FACTORY_BUILD_PIPELINE_ID" FACTORY_SKIP_APPLY="$FACTORY_SKIP_APPLY"
    FACTORY_SCHEDULE="$FACTORY_SCHEDULE"
    TRIGGER_PAYLOAD="$TRIGGER_PAYLOAD" FACTORY_GITLAB_TOKEN="$FACTORY_GITLAB_TOKEN" TEAMS_WEBHOOK_URL="$TEAMS_WEBHOOK_URL"
    FACTORY_DASHBOARD_TOKEN="$FACTORY_DASHBOARD_TOKEN" FACTORY_TRIGGER_TOKEN="$FACTORY_TRIGGER_TOKEN" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
    TENSORX_API_KEY="$TENSORX_API_KEY" BERGET_API_KEY="$BERGET_API_KEY"
    node --import tsx factory/steps/retry-waiting.ts
# The watcher opens tickets from error logs. While logSource is files (fake errors), a person starts it
# by hand: Run pipeline in the web UI with FACTORY_SCHEDULE=watch and FACTORY_TARGET set, then press play on the
# manual job. A trigger caller can forge CI_PIPELINE_SOURCE, so the manual play is the real guard.
watcher:
  extends: .factory
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $FACTORY_SCHEDULE == "watch"
    when: manual
  script:
  - >-
    env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root
    CLAUDE_CONFIG_DIR="$PWD/run/claude-home"
    CI_SERVER_URL="$CI_SERVER_URL" CI_PROJECT_ID="$CI_PROJECT_ID" CI_PIPELINE_ID="$CI_PIPELINE_ID"
    CI_PIPELINE_URL="$CI_PIPELINE_URL" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_IMAGE="$CI_JOB_IMAGE" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE" CI_JOB_ID="$CI_JOB_ID"
    FACTORY_PIPELINE="$FACTORY_PIPELINE" FACTORY_TARGET="$FACTORY_TARGET" FACTORY_WORK_ITEM_IID="$FACTORY_WORK_ITEM_IID"
    FACTORY_MR_IID="$FACTORY_MR_IID" FACTORY_BUILD_PIPELINE_ID="$FACTORY_BUILD_PIPELINE_ID" FACTORY_SKIP_APPLY="$FACTORY_SKIP_APPLY"
    FACTORY_SCHEDULE="$FACTORY_SCHEDULE"
    TRIGGER_PAYLOAD="$TRIGGER_PAYLOAD" FACTORY_GITLAB_TOKEN="$FACTORY_GITLAB_TOKEN" TEAMS_WEBHOOK_URL="$TEAMS_WEBHOOK_URL"
    FACTORY_DASHBOARD_TOKEN="$FACTORY_DASHBOARD_TOKEN" FACTORY_TRIGGER_TOKEN="$FACTORY_TRIGGER_TOKEN" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
    TENSORX_API_KEY="$TENSORX_API_KEY" BERGET_API_KEY="$BERGET_API_KEY"
    node --import tsx factory/steps/watcher.ts
