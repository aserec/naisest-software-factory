# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- deploy
# Build pipeline
- event
- triage
- prepare-patch
- code-review
- precommit-gate
- risk-check
- decision
# Finish pipeline
- apply
- verify
- result-saved
sast:
  stage: test
  tags: [factory]
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
  tags: [factory]
smoke:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile --filter software-factory
  - pnpm tsc --noEmit
  - pnpm vitest run

# Builds runner/Dockerfile into this project's registry, only on main, so only a reviewed change makes an image.
# kaniko needs no Docker socket and no privileged mode. It pushes job:<sha> and job:main. Factory jobs run job:main
# until go-live pins them by digest, so after that a later push to the same tag changes nothing they run.
job-image:
  stage: test
  tags: [factory]
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.0-debug@sha256:350929376b8a69afb1d8b362086c809e4ef6799fa1bcb317c2806ae1447b3845
    entrypoint: [""]
  rules:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes: [runner/Dockerfile]
  script:
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/runner/Dockerfile" --destination "$CI_REGISTRY_IMAGE/job:$CI_COMMIT_SHORT_SHA" --destination "$CI_REGISTRY_IMAGE/job:main" --digest-file /kaniko/digest
  - echo "Job image, for the .factory image and every jobImage in targets/*.yml - $CI_REGISTRY_IMAGE/job@$(cat /kaniko/digest)"
# The dashboard is a separate Next.js app. Only this job installs the whole workspace.
dashboard-test:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile
  - pnpm --filter factory-dashboard typecheck
  - pnpm --filter factory-dashboard test
  - pnpm --filter factory-dashboard build

# Browser test of the board, the run timeline and the step detail, on a seeded database and a stub GitLab.
# The image has the browsers; its version must match @playwright/test in dashboard/package.json (1.62.1).
dashboard-e2e:
  stage: test
  tags: [factory]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile
  - pnpm --filter factory-dashboard exec playwright test

# Deploys the dashboard on its VM after the tests pass. The image is built on the VM, because factory
# runners have no Docker socket. DASHBOARD_DEPLOY_KEY and DASHBOARD_KNOWN_HOSTS are protected File variables
# scoped to the dashboard environment, so no other job gets them. The job waits until DASHBOARD_HOST is set.
deploy-dashboard:
  stage: deploy
  tags: [factory]
  image: node:22
  resource_group: dashboard-deploy
  environment: { name: dashboard }
  rules:
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $DASHBOARD_HOST'
    changes: ["dashboard/**", "factory/run-events.ts", "deploy/**", "targets/**", "pnpm-lock.yaml"]
  script:
  # ssh refuses a key file that others can read.
  - chmod 600 "$DASHBOARD_DEPLOY_KEY"
  - ssh -i "$DASHBOARD_DEPLOY_KEY" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DASHBOARD_KNOWN_HOSTS" deploy@"$DASHBOARD_HOST" "cd /opt/software-factory && git fetch origin && git checkout --force $CI_COMMIT_SHA && docker compose -f deploy/compose.yml up -d --build"

# Runs the contracts against a real GitLab test project. Start it by hand from a web pipeline.
contract-real:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
  script:
  - corepack enable
  - pnpm install --frozen-lockfile --filter software-factory
  - FACTORY_CONTRACT_REAL=1 pnpm vitest run factory/contracts

# One job per step. State passes between jobs in run/: record.json, the target clone and the Claude session.
#
# Trigger callers can set any variable (NODE_OPTIONS, npm_config_*, PATH, ...). So every command starts
# through `env -i` with an explicit allowlist, and node and pnpm never see the job environment.
# factory/ci.test.ts checks this. The job shell itself still sees every variable (for example BASH_ENV):
# docs/setup.md section 7 explains why webhook settings must stay Maintainer-only.
# Allowed CI_* values: CI_SERVER_URL, CI_PROJECT_ID, CI_PIPELINE_ID, CI_PIPELINE_URL, CI_COMMIT_REF_NAME, CI_JOB_IMAGE, CI_PIPELINE_SOURCE, CI_JOB_ID.
# FACTORY_PIPELINE (build, finish or dispatch) selects a triggered pipeline. FACTORY_SCHEDULE (poll, retry or improve) selects a scheduled job; watch selects the watcher in a pipeline started by hand.
# The adapters (seams.yml) and the models (router.yml) are read from this checkout, never chosen by a variable.
# FACTORY_GITLAB_TOKEN, TEAMS_WEBHOOK_URL, SLACK_WEBHOOK_URL, FACTORY_DASHBOARD_TOKEN, FACTORY_TRIGGER_TOKEN and TRIGGER_PAYLOAD are File variables, so only paths pass.
.factory:
  tags: [factory]
  # A fixed image, never a variable: trigger callers can set any variable. Every target's jobImage must be
  # this image (makeContext in factory/compose.ts checks). It is runner/Dockerfile, with Chromium for the screenshots,
  # built by job-image. ponytail: the main tag moves with each build; pin it by digest at go-live (docs/go-live.md).
  image: gitlab.example.com:5050/ceresa/software-factory/job:main
  timeout: 3h
  before_script:
  # The factory's own dependencies, installed with no job variables and no secrets.
  - env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root CI=true COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile --filter software-factory
  # The one allowlist every step starts through. It defines a shell function, so it reaches the job script in the
  # same shell; a job that sets its own before_script loses it and fails. factory/ci.test.ts checks it.
  - >-
    factory_env() {
    env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root
    CLAUDE_CONFIG_DIR="$PWD/run/claude-home"
    PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    CI_SERVER_URL="$CI_SERVER_URL" CI_PROJECT_ID="$CI_PROJECT_ID" CI_PIPELINE_ID="$CI_PIPELINE_ID"
    CI_PIPELINE_URL="$CI_PIPELINE_URL" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_IMAGE="$CI_JOB_IMAGE" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE" CI_JOB_ID="$CI_JOB_ID"
    FACTORY_PIPELINE="$FACTORY_PIPELINE" FACTORY_TARGET="$FACTORY_TARGET" FACTORY_WORK_ITEM_IID="$FACTORY_WORK_ITEM_IID"
    FACTORY_MR_IID="$FACTORY_MR_IID" FACTORY_BUILD_PIPELINE_ID="$FACTORY_BUILD_PIPELINE_ID" FACTORY_SKIP_APPLY="$FACTORY_SKIP_APPLY"
    FACTORY_SCHEDULE="$FACTORY_SCHEDULE"
    TRIGGER_PAYLOAD="$TRIGGER_PAYLOAD" FACTORY_GITLAB_TOKEN="$FACTORY_GITLAB_TOKEN" TEAMS_WEBHOOK_URL="$TEAMS_WEBHOOK_URL" SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL"
    FACTORY_DASHBOARD_TOKEN="$FACTORY_DASHBOARD_TOKEN" FACTORY_TRIGGER_TOKEN="$FACTORY_TRIGGER_TOKEN" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
    TENSORX_API_KEY="$TENSORX_API_KEY" CELERIS_API_KEY="$CELERIS_API_KEY"
    "$@"; }
  artifacts:
    when: always
    paths: [run/]
    exclude: [run/target/node_modules/**] # each job installs again, inside the sandbox
    expire_in: 90 days
.build:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "build"
.finish:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "finish"
event:
  extends: .build
  stage: event
  needs: []
  # One event job per target at a time: webhook triggers do not know the iid, poller and retry starts do,
  # and all of them must wait for each other (decideStart's caller contract and the per-repo run count).
  resource_group: factory-$FACTORY_TARGET
  script:
  - factory_env node --import tsx factory/steps/event.ts
triage:
  extends: .build
  stage: triage
  needs: [event]
  script:
  - factory_env node --import tsx factory/steps/triage.ts
prepare-patch:
  extends: .build
  stage: prepare-patch
  needs: [triage]
  script:
  - factory_env node --import tsx factory/steps/prepare-patch.ts
code-review:
  extends: .build
  stage: code-review
  needs: [prepare-patch]
  script:
  - factory_env node --import tsx factory/steps/code-review.ts
precommit-gate:
  extends: .build
  stage: precommit-gate
  needs: [code-review]
  script:
  - factory_env node --import tsx factory/steps/precommit-gate.ts
risk-check:
  extends: .build
  stage: risk-check
  needs: [precommit-gate]
  script:
  - factory_env node --import tsx factory/steps/risk-check.ts
decision:
  extends: .build
  stage: decision
  needs: [risk-check]
  script:
  - factory_env node --import tsx factory/steps/decision.ts
apply:
  extends: .finish
  stage: apply
  needs: []
  script:
  - factory_env node --import tsx factory/steps/apply.ts
verify:
  extends: .finish
  stage: verify
  needs: [apply]
  script:
  - factory_env node --import tsx factory/steps/verify.ts
result-saved:
  extends: .finish
  stage: result-saved
  needs: [verify]
  script:
  - factory_env node --import tsx factory/steps/result-saved.ts
# Scheduled pipelines (docs/setup.md section 8). They start build pipelines through the trigger API.
poll:
  extends: .factory
  stage: event
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $FACTORY_SCHEDULE == "poll"
  script:
  - factory_env node --import tsx factory/steps/poll.ts
resume-waiting:
  extends: .factory
  stage: event
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $FACTORY_SCHEDULE == "retry"
  script:
  - factory_env node --import tsx factory/steps/resume-waiting.ts
# The weekly self-improvement job (docs/setup.md section 8). It can wait up to an hour for the pipeline of its fix.
improve:
  extends: .factory
  stage: event
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $FACTORY_SCHEDULE == "improve"
  script:
  - factory_env node --import tsx factory/steps/improve.ts
# Turns dispatches from outside systems into tickets, like the watcher does. The dashboard starts it through
# the trigger API when a dispatch arrives (POST /api/dispatches), and again for one still waiting after 15 minutes.
dispatch:
  extends: .factory
  stage: event
  # Two runs at once could both find no open ticket for the same dispatch and open two.
  resource_group: dispatch-$FACTORY_TARGET
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "dispatch"
  script:
  - factory_env node --import tsx factory/steps/dispatch.ts
# The watcher opens tickets from error logs. While logSource is files (fake errors), a person starts it
# by hand: Run pipeline in the web UI with FACTORY_SCHEDULE=watch and FACTORY_TARGET set, then press play on the
# manual job. A trigger caller can forge CI_PIPELINE_SOURCE, so the manual play is the real guard.
watcher:
  extends: .factory
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" && $FACTORY_SCHEDULE == "watch"
    when: manual
  script:
  - factory_env node --import tsx factory/steps/watcher.ts
