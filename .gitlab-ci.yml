# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
# Build pipeline
- event
- triage
- prepare-patch
- code-review
- precommit-gate
- risk-check
- decision
# Finish pipeline
- apply
- verify
- result-saved
sast:
  stage: test
  tags: [factory]
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
  tags: [factory]
smoke:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile --filter software-factory
  - pnpm tsc --noEmit
  - pnpm vitest run

# The dashboard is a separate Next.js app. Only this job installs the whole workspace.
dashboard-test:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile
  - pnpm --filter factory-dashboard typecheck
  - pnpm --filter factory-dashboard test
  - pnpm --filter factory-dashboard build

# Browser test of the board, the run timeline and the step detail, on a seeded database and a stub GitLab.
# The image has the browsers; its version must match @playwright/test in dashboard/package.json (1.62.1).
dashboard-e2e:
  stage: test
  tags: [factory]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger" && $CI_PIPELINE_SOURCE != "schedule"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile
  - pnpm --filter factory-dashboard exec playwright test

# Runs the contracts against a real GitLab test project. Start it by hand from a web pipeline.
contract-real:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
  script:
  - corepack enable
  - pnpm install --frozen-lockfile --filter software-factory
  - FACTORY_CONTRACT_REAL=1 pnpm vitest run factory/contracts

# One job per step. State passes between jobs in run/: record.json, the target clone and the Claude session.
#
# Trigger callers can set any variable (NODE_OPTIONS, npm_config_*, PATH, ...). So every command starts
# through `env -i` with an explicit allowlist, and node and pnpm never see the job environment.
# factory/ci.test.ts checks this. The job shell itself still sees every variable (for example BASH_ENV):
# docs/setup.md section 7 explains why webhook settings must stay Maintainer-only.
# Allowed CI_* values: CI_SERVER_URL, CI_PROJECT_ID, CI_PIPELINE_ID, CI_PIPELINE_URL, CI_COMMIT_REF_NAME, CI_JOB_IMAGE, CI_PIPELINE_SOURCE, CI_JOB_ID.
# FACTORY_SCHEDULE (poll or retry) selects a scheduled job; watch selects the watcher in a pipeline started by hand.
# The adapters (seams.yml) and the models (router.yml) are read from this checkout, never chosen by a variable.
# FACTORY_GITLAB_TOKEN, TEAMS_WEBHOOK_URL, FACTORY_DASHBOARD_TOKEN, FACTORY_TRIGGER_TOKEN and TRIGGER_PAYLOAD are File variables, so only paths pass.
.factory:
  tags: [factory]
  # A fixed image, never a variable: trigger callers can set any variable. Every target's jobImage must be
  # this image (makeContext in factory/compose.ts checks). ponytail: one image for all targets; pin it by digest at go-live.
  image: node:22
  timeout: 3h
  before_script:
  # The factory's own dependencies, installed with no job variables and no secrets.
  - env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root CI=true COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile --filter software-factory
  artifacts:
    when: always
    paths: [run/]
    exclude: [run/target/node_modules/**] # each job installs again, inside the sandbox
    expire_in: 90 days
.build:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "build"
.finish:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "finish"
event:
  extends: .build
  stage: event
  needs: []
  # One event job per target at a time: webhook triggers do not know the iid, poller and retry starts do,
  # and all of them must wait for each other (decideStart's caller contract and the per-repo run count).
  resource_group: factory-$FACTORY_TARGET
  script:
  - >-
    env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root
    CLAUDE_CONFIG_DIR="$PWD/run/claude-home"
    CI_SERVER_URL="$CI_SERVER_URL" CI_PROJECT_ID="$CI_PROJECT_ID" CI_PIPELINE_ID="$CI_PIPELINE_ID"
    CI_PIPELINE_URL="$CI_PIPELINE_URL" CI_COMMIT_REF_NAME="$CI_COMMIT_REF_NAME" CI_JOB_IMAGE="$CI_JOB_IMAGE" CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE" CI_JOB_ID="$CI_JOB_ID"
    FACTORY_PIPELINE="$FACTORY_PIPELINE" FACTORY_TARGET="$FACTORY_TARGET" FACTORY_WORK_ITEM_IID="$FACTORY_WORK_ITEM_IID"
    FACTORY_MR_IID="$FACTORY_MR_IID" FACTORY_BUILD_PIPELINE_ID="$FACTORY_BUILD_PIPELINE_ID" FACTORY_SKIP_APPLY="$FACTORY_SKIP_APPLY"
    FACTORY_SCHEDULE="$FACTORY_SCHEDULE"
    TRIGGER_PAYLOAD="$TRIGGER_PAYLOAD" FACTORY_GITLAB_TOKEN="$FACTORY_GITLAB_TOKEN" TEAMS_WEBHOOK_URL="$TEAMS_WEBHOOK_URL"
    FACTORY_DASHBOARD_TOKEN="$FACTORY_DASHBOARD_TOKEN" FACTORY_TRIGGER_TOKEN="$FACTORY_TRIGGER_TOKEN" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
    TENSORX_API_KEY="$TENSORX_API_KEY" BERGET_API_KEY="$BERGET_API_KEY"
    node --import tsx factory/steps/event.ts
