# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
# Build pipeline
- event
- triage
- prepare-patch
- code-review
- precommit-gate
- risk-check
- decision
# Finish pipeline
- apply
- verify
- result-saved
sast:
  stage: test
  tags: [factory]
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
  tags: [factory]
smoke:
  stage: test
  tags: [factory]
  image: node:22
  rules:
  - if: $CI_PIPELINE_SOURCE != "trigger"
  script:
  - corepack enable
  - pnpm install --frozen-lockfile
  - pnpm vitest run

# One job per step. State passes between jobs in run/: record.json, the target clone and the Claude session.
.factory:
  tags: [factory]
  # A fixed image, never a variable: trigger callers can set any variable. Every target's jobImage must be
  # this image (makeContext checks). ponytail: one image for all targets; pin it by digest at go-live.
  image: node:22
  timeout: 3h
  variables:
    CLAUDE_CONFIG_DIR: $CI_PROJECT_DIR/run/claude-home
  before_script:
  - corepack enable
  - pnpm install --frozen-lockfile
  artifacts:
    when: always
    paths: [run/]
    exclude: [run/target/node_modules/**] # each job installs again, inside the sandbox
    expire_in: 90 days
.build:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "build"
.finish:
  extends: .factory
  rules:
  - if: $CI_PIPELINE_SOURCE == "trigger" && $FACTORY_PIPELINE == "finish"
event:
  extends: .build
  stage: event
  needs: []
  # One event job per work item at a time (decideStart's caller contract). Webhook triggers do not
  # know the iid yet, so there the group is the whole target, which also guards the per-repo run count.
  resource_group: factory-$FACTORY_TARGET-$FACTORY_WORK_ITEM_IID
  script: [pnpm tsx factory/steps/event.ts]
triage:
  extends: .build
  stage: triage
  needs: [event]
  script: [pnpm tsx factory/steps/triage.ts]
prepare-patch:
  extends: .build
  stage: prepare-patch
  needs: [triage]
  script: [pnpm tsx factory/steps/prepare-patch.ts]
code-review:
  extends: .build
  stage: code-review
  needs: [prepare-patch]
  script: [pnpm tsx factory/steps/code-review.ts]
precommit-gate:
  extends: .build
  stage: precommit-gate
  needs: [code-review]
  script: [pnpm tsx factory/steps/precommit-gate.ts]
risk-check:
  extends: .build
  stage: risk-check
  needs: [precommit-gate]
  script: [pnpm tsx factory/steps/risk-check.ts]
decision:
  extends: .build
  stage: decision
  needs: [risk-check]
  script: [pnpm tsx factory/steps/decision.ts]
apply:
  extends: .finish
  stage: apply
  needs: []
  script: [pnpm tsx factory/steps/apply.ts]
verify:
  extends: .finish
  stage: verify
  needs: [apply]
  script: [pnpm tsx factory/steps/verify.ts]
result-saved:
  extends: .finish
  stage: result-saved
  needs: [verify]
  script: [pnpm tsx factory/steps/result-saved.ts]
