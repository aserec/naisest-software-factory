# Runs on the dashboard VM: docker compose -f deploy/compose.yml up -d --build
# deploy/.env (never in git) holds the dashboard's secrets and DASHBOARD_HOST for Caddy.
services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    env_file: .env
    volumes:
    - data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
    - "80:80"
    - "443:443"
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?set DASHBOARD_HOST in deploy/.env}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    depends_on: [dashboard]
    restart: unless-stopped
volumes:
  data:
  caddy_data:
  caddy_config:
