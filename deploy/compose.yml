# Installed by ./install.sh. By hand: docker compose -f deploy/compose.yml up -d --build
# deploy/.env (never in git) holds the secrets, DASHBOARD_HOST for Caddy and COMPOSE_PROFILES: worker (runs tickets here)
# or hetzner (GitLab CI runs them on Hetzner VMs).
services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    env_file: .env
    volumes:
    - data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
    - "80:80"
    - "443:443"
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?set DASHBOARD_HOST in deploy/.env}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    networks:
      default:
        aliases: [caddy.internal] # the worker's way in, see the Caddyfile
    depends_on: [dashboard]
    restart: unless-stopped
  # Only builds the CI job image (runner/Dockerfile) for the worker to start from. It exits at once.
  runner-image:
    profiles: [worker]
    build:
      context: ..
      dockerfile: runner/Dockerfile
    command: ["true"]
  # factory/worker.ts. It runs each step in a new container from its own image (factory-worker): on this
  # machine (FACTORY_EXECUTOR machine, the default) or on a new Hetzner VM per run (hetzner).
  worker:
    profiles: [worker]
    image: factory-worker
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
      additional_contexts:
        runner: service:runner-image
    # Only what the worker needs, not the dashboard's tokens.
    environment:
      FACTORY_EXECUTOR: ${FACTORY_EXECUTOR:-machine}
      HETZNER_TOKEN: ${HETZNER_TOKEN:-}
      GL_TOKEN: ${GL_TOKEN:-}
      FACTORY_GITHUB_TOKEN: ${FACTORY_GITHUB_TOKEN:-}
      TENSORX_API_KEY: ${TENSORX_API_KEY:-}
      FACTORY_DASHBOARD_TOKEN: ${FACTORY_DASHBOARD_TOKEN:-}
      # The chat seam's webhook (seams.yml chat: teams or slack). Only the picked one must be set.
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Containers on this machine reach Caddy on the factory network; VMs reach it at its public name.
      FACTORY_DASHBOARD_URL: ${FACTORY_DASHBOARD_URL:-https://caddy.internal}
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
    - caddy_data:/caddy:ro
    - runs:/app.runs # finished runs; only the worker writes here
    - ./runner:/app/deploy/runner:ro # the Hetzner VMs' cloud-init.yml, written by install.sh
    # The worker starts the step containers. ponytail: the socket gives the worker root on this machine; no step
    # container gets it, and no agent runs in the worker. Use the hetzner executor to keep runs off this machine.
    - /var/run/docker.sock:/var/run/docker.sock
    # poll, retry and dispatch run in the worker itself, and the dispatch writer is an agent: bubblewrap needs user namespaces.
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    depends_on: [caddy]
    restart: unless-stopped
  # Instead of the worker: GitLab CI schedules poll, and this runner starts one Hetzner VM per job.
  # install.sh fills deploy/runner/ from runner/config.toml.example and runner/cloud-init.yml.
  hetzner-runner:
    profiles: [hetzner]
    image: gitlab/gitlab-runner:alpine-v19.5.0
    entrypoint: ["sh", "-c", "gitlab-runner fleeting install && exec gitlab-runner run"]
    volumes:
    - ./runner:/etc/gitlab-runner
    - fleeting_plugins:/root/.config/fleeting
    restart: unless-stopped
# Named, so the worker can put step containers on it (docker run --network factory).
networks:
  default:
    name: factory
volumes:
  runs:
  data:
  caddy_data:
  caddy_config:
  fleeting_plugins:
