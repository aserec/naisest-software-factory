# The tracker is gitlab, github (issues, state as factory_* labels) or github-project (state as the Status column of a
# GitHub Projects board). The github ones need FACTORY_GITHUB_TOKEN and githubRepo (+ githubProject) in the target file.
tracker: gitlab
codeHost: gitlab
# The CI is local (factory/worker.ts: each step in a new container, on this machine or a Hetzner VM per run)
# or gitlab (.gitlab-ci.yml).
ci: local
judge: jev-celeris
# The one GitLab the gitlab adapters talk to. Its token goes here, so it is never taken from an env variable.
gitlabUrl: https://gitlab.example.com
# chat is console (notices go to the job log), teams (TEAMS_WEBHOOK_URL) or slack (SLACK_WEBHOOK_URL).
chat: slack
logSource: files
dashboard: http
# The dashboard's address, e.g. https://factory.<domain>. makeContext refuses the placeholder.
# Outside GitLab CI, FACTORY_DASHBOARD_URL replaces it (the local scripts default it to https://localhost:3000).
dashboardUrl: REPLACE_WITH_DASHBOARD_URL
# Used when judge is model-call. jev-celeris needs CELERIS_API_KEY.
judgeModel: { provider: tensorx, model: deepseek/deepseek-v4.1-flash-1017 }
# The dashboard's agent chat answers with this model. factoryRepo is where its approved fixes open PRs.
chatModel: { provider: tensorx, model: deepseek/deepseek-v4.1-flash-1017 }
factoryRepo: { projectPath: Ceresa/software-factory, baseBranch: main }
providers:
  team-plan: { api: anthropic, keyEnv: CLAUDE_CODE_OAUTH_TOKEN, onlyHarness: claude-code, models: { claude-sonnet-5-5: sonnet, claude-opus-5-5: opus }, images: [claude-sonnet-5-5, claude-opus-5-5] }
  tensorx: { api: openai, baseUrl: https://api.tensorx.ai/v1, keyEnv: TENSORX_API_KEY, models: { deepseek/deepseek-v4.1-flash-1017: deepseek, z-ai/glm-5.3-flash: glm },
    # TensorX rates as listed on requesty.ai/models/tensorx (2026-11). glm-5.3-flash has no listed price yet.
    prices: { deepseek/deepseek-v4.1-flash-1017: { input: 0.5, output: 1.5, cacheRead: 0.13 } } }
