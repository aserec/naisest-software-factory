# Runs every unit test, both typechecks and the dashboard e2e in Linux, like CI: docker compose -f compose.test.yml run --rm test
# The image's Playwright must match @playwright/test in dashboard/package.json. The volumes keep Linux node_modules and
# the Linux .next build out of the host checkout.
services:
  test:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "1"
    volumes:
    - .:/app
    - node_modules:/app/node_modules
    - dashboard_node_modules:/app/dashboard/node_modules
    - dashboard_next:/app/dashboard/.next
    # jq runs the command guard, unzip reads run artifacts and lsof frees ports, as the factory tests expect.
    command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq jq unzip lsof >/dev/null && corepack enable && pnpm install --frozen-lockfile && pnpm precommit && pnpm e2e"]
volumes:
  node_modules:
  dashboard_node_modules:
  dashboard_next:
